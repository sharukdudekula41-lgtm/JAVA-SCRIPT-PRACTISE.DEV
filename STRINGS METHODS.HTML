<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0, initial-scale=1.0">
    <title>STRING METHODS</title>
</head>
<body>
    <script>
        //STRING LENGTH
        let str1 = "Hello";
        console.log(str1.length);

        //STRING UPPER CASE AND LOWER CASE
        let str2="Hello World";
        console.log(str2.toUpperCase());
        console.log(str2.toLowerCase());

        //STRING INCLUDES() 
        let str3 = "JAVA SCRIPT";
        console.log(str3.includes("SCRIPT"));
        console.log(str3.includes("JAVA"));
        
        //STRING SLICE()
        let str4 = "Java Script";
        console.log(str4.slice(0,4));

        //STRING TRIM()
        let str5 = " Hello World ";
        console.log(str5.trim());
 
        //STRING REPLACE
        let str6 = "Hello World";
        console.log(str6.replace("Hello","Hi"));

        //STRING CONCAT()
        let str7 = "Hello";
        let str8 = "World";
        console.log(str7.concat(" ",str8));

        //STRING CharAt
        let str9 = "Hello World";
        console.log(str9.charAt(0));
        console.log(str9.charAt(1));
        console.log(str9.charAt(2));

         // STRING SPLIT()
         let str10 = "Hello World";
         console.log(str10.split(", "));
         
         
    </script>
    
</body>
</html>
