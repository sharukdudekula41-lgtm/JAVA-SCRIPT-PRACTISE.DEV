<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECTORS IN CSS</title>
</head>
<body style="text-align: center;">
    <h1 style="color: rgb(27, 111, 221);">SELECTORS IN CSS</h1>
    <style>
        .h2 {
            color:rgb(10, 143, 87)
        }
        .ele5{
            color:rgb(9, 121, 121)
        }
        .content{
            background-color: rgb(255, 19, 19);
        }
        .content{
            font-family: 'Courier New', Courier, monospace;
        }
        .content{
            font-style: italic;
        }
        .content{
            font-variant: small-caps;
        }
        .ele5{
            font-size: xx-large;
        }
        h1,h2,h3,h4{
            color:rgba(31, 62, 236, 0.795);
        }
    </style>
<p> MY NAME SHARUKH</p>
<h1 class="ele1 content"id="head">HELLO SHARUKH</h1>
<h2 class="ele2">HELLO SHARUKH</h2>
<h3 class="ele3">HELLO SHARUKH</h3>
<h4 class="ele4">HELLO SHARUKH</h4>

    
    
</body>

</html>
