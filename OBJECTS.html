<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECTS IN JS</title>
</head>
<body>
    <script>
        //OBJECTS IN JS
        let car = {
            brand:"Toyoata",
            model:" Innova",
            year:2022
            
        };
        console.log(car.brand);

        //DOT NOTATION
         console.log(car.brand);

         //BRACKET NOTATION
         console.log(car["brand"]);

         //ADDING NEW PROPERTIES
         car.price="1000000";
         console.log(car);

         //DELETING PROPERTIES
         delete car.price;
         console.log(car);
 
          //UPDATING PROPERTIES
          car.brand="Honda";
          console.log(car);

          //UPDATING OBJECTIVE VALUES
          car.color="Black";
          console.log(car);
          
        
    </script>
    
</body>
</html>
