<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRAY METHODS IN JAVA SCRIPT </title>
</head>
<body>
    <script>
        //ADDING METHODS
        //Push Method
          let array1=[1,2,3,4,5];
          array1.push(6);
          console.log(array1);
        //Un Shift
        let array2=[1,2,3,4,5];
        array2.unshift(0);
        console.log(array2);

        //REMOVING ELEMENTS
        //Pop Method
        let array3=[1,2,3,4,5];
        array3.pop(2);
        console.log(array3);
        //Shift Method
        let array4=[1,2,3,4,5];
        array4.shift(1);
        console.log(array4);

        //SEARCHING METHODS
        //Index Of Method
        let array5=[1,2,3,4,5];
        array5.indexOf(3);
        console.log(array5);
        //Includes Method
        let array6=[1,2,3,4,5];
        array6.includes(3);

        //TRANSFORMING METHODS
        //Map Method
        let array7=[1,2,3,4,5];
        let doubled=array7.map(array7=>array7*2);
        console.log(doubled);
        //Filter Method
        let array8=[1,2,3,4,5];
        let even=array8.filter(array8=>array8%2==0);
        console.log(even);
        

        //ITERATION METHODS
        //forEach Method
        let array9=[1,2,3,4,5];
        array9.forEach(array9=>console.log(array9));

          //CONVERTING ARRAYS TO STRINGS
          //Join Method
          let array10=[1,2,3,4,5];
          let joined=array10.join("-");
          console.log(joined);


        //SLICING AND SPLICING
        //Slice Method
       let array11=[1,2,3,4,5];
       let sliced=array10.slice(1,3);
       console.log(sliced);
       //Splice Method
       let array12=[1,2,3,4,5];
       let spliced=array11.splice(1,3);
       console.log(spliced);
       console.log(array11);
            

       //SORTING AND REVERSING
       //Sort Method
       let array13=[4,2,5,1,3];
       let sorted=array13.sort();
       console.log(sorted);
       //Reverse Method
       let array14=[1,2,3,4,5];
       let reversed=array14.reverse();
       console.log(reversed);

       //REDUCE METHOD
       let array15=[1,2,3,4,5];
       let sum=array15.reduce((total,currentValue)=>total+currentValue,0);
       console.log(sum);

</script>
    
</body>
</html>
