<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERATORS IN JS</title>
</head>
<body>
    <script>
       // ARTHEMETIC OPERATORS
       let a=10;
       let b=20;
       console.log(a+b);
       console.log(a-b);
       console.log(a*b);
       console.log(a/b);
       console.log(a%b);

       //COMPARSION OPERATORS
       let a1=20;
       let b1=30;
       console.log(a1==b1);
       console.log(a1!=b1);
       console.log(a1>b1);
       console.log(a1<b1);
       console.log(a1<=b1);
       console.log(a1>=b1);

       //LOGICAL OPERATORS
       let a2=40;
       let b2=40;
            
       console.log(b2>a2 && a2<b2);
       console.log(a2<b2||b2>a2);
       console.log(!( b2>a2));
        console.log(!(a2<b2));

        //TYPE OF OPERATOR
        let a3="hello"
        console.log(typeof a3);

        //STRING OPERATOR
        let FirstName ="Java";
        let SecondName = "Script";
        console.log(FirstName+SecondName);




        
        
       





    </script>
    
</body>
</html>
