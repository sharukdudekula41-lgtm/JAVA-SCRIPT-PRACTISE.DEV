    <title>GRID IN CSS</title>
    <style>
        #box{
            height: 50dvh;
            border: 1px solid black;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            
            grid-gap: 10px;
        }
        #box div{
            padding: 10px;
            border: 2px solid black;
            background-color: lightcoral;
        }
        .card{
            border: 2px solid black;
            padding: 10px;
            width: 100%;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
